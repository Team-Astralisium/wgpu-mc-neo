pluginManagement {
    repositories {
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Kotlin for Forge'
            url = 'https://thedarkcolour.github.io/KotlinForForge/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "wgpu-mc"

def subProject(String name) {
    setupSubproject("wgpu-mc-$name") {
        projectDir = file(name)
    }
}

def setupSubproject(String name, Closure block) {
    include(name)
    project(":$name").with(block)
}

subProject("rust")
subProject("neoforge")
